# Builds the desktop app: a Windows MSI (with libmpv), the Linux app folder and a .deb.
# On version tags the builds are attached to the release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fetch libmpv
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets | Where-Object { $_.name -like 'mpv-dev-x86_64-*.7z' -and $_.name -notlike '*v3*' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv-dev.7z
          7z e -y -opackaging/resources/windows mpv-dev.7z libmpv-2.dll
      - name: Build the installer
        run: ./gradlew.bat packageReleaseMsi
      - uses: actions/upload-artifact@v4
        with:
          name: tonearm-desktop-windows
          path: build/compose/binaries/main-release/msi/*.msi
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/compose/binaries/main-release/msi/*.msi --clobber

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          ./gradlew test createReleaseDistributable packageReleaseDeb
          tar czf build/Tonearm-desktop-linux-x64.tar.gz -C build/compose/binaries/main-release/app Tonearm
      - uses: actions/upload-artifact@v4
        with:
          name: tonearm-desktop-linux
          path: |
            build/Tonearm-desktop-linux-x64.tar.gz
            build/compose/binaries/main-release/deb/*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/compose/binaries/main-release/deb/*.deb --clobber
